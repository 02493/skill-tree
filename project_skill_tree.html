<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Skill Tree</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#fff; color:#222; font-family:Arial, sans-serif; }
  #viewport { width:100%; height:100%; cursor:grab; }
  #viewport:active { cursor:grabbing; }
  svg { width:100%; height:100%; display:block; }
  .orbit { fill:none; stroke:#d7d7d7; stroke-width:1; stroke-dasharray:3 5; }
  .connection { stroke:#999; stroke-width:1; }
  .node circle { fill:#fff; stroke:#555; stroke-width:1; }
  .node text { fill:#222; font-size:12px; font-weight:600; text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  .core circle { stroke:#222; stroke-width:1.5; }
  .core text { font-size:13px; }
</style>
</head>
<body>
<div id="viewport">
<svg id="map" viewBox="0 0 1600 1200" aria-label="Схема проектов">
  <g id="scene">
    <circle class="orbit" cx="800" cy="600" r="300"/>
    <circle class="orbit" cx="800" cy="600" r="520"/>
    <g id="connections"></g>
    <g id="nodes"></g>
  </g>
</svg>
</div>
<script>
const projects = ["DO1","QA1","C2","BSA00","PM1","DS1","CbS1","PJM1","UX/UI1","TP1","AIE1"];
const nextProjects = ["DO2","QA2","C3","BSA01","PM2","DS2","CbS2","PJM2","UX/UI2","TP2","AIE2"];
const cx = 800, cy = 600, firstRadius = 300, secondRadius = 520;
const connectionLayer = document.getElementById("connections");
const nodeLayer = document.getElementById("nodes");

function make(tag, attrs, parent) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([key,value]) => el.setAttribute(key,value));
  parent.appendChild(el);
  return el;
}

const core = make("g", {class:"node core"}, nodeLayer);
make("circle", {cx,cy,r:48}, core);
make("text", {x:cx,y:cy+1}, core).textContent = "core_strage";

projects.forEach((name, i) => {
  const angle = -Math.PI/2 + i * 2*Math.PI/projects.length;
  const x1 = cx + firstRadius * Math.cos(angle);
  const y1 = cy + firstRadius * Math.sin(angle);
  const x2 = cx + secondRadius * Math.cos(angle);
  const y2 = cy + secondRadius * Math.sin(angle);

  // Связь центра с первой орбитой
  make("line", {class:"connection",x1:cx,y1:cy,x2:x1,y2:y1}, connectionLayer);

  // Связь первого проекта со вторым проектом той же ветки
  make("line", {class:"connection",x1,y1,x2,y2}, connectionLayer);

  const firstNode = make("g", {class:"node",tabindex:"0"}, nodeLayer);
  make("circle", {cx:x1,cy:y1,r:29}, firstNode);
  make("text", {x:x1,y:y1+1}, firstNode).textContent = name;

  const secondNode = make("g", {class:"node",tabindex:"0"}, nodeLayer);
  make("circle", {cx:x2,cy:y2,r:29}, secondNode);
  make("text", {x:x2,y:y2+1}, secondNode).textContent = nextProjects[i];
});

// Перемещение и масштабирование схемы
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
let scale = 1, tx = 0, ty = 0, dragging = false, startX = 0, startY = 0;
function update() { scene.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`); }

svg.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  dragging = true;
  startX = e.clientX - tx;
  startY = e.clientY - ty;
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!dragging) return;
  tx = e.clientX - startX;
  ty = e.clientY - startY;
  update();
});
svg.addEventListener("pointerup", () => dragging = false);
svg.addEventListener("pointercancel", () => dragging = false);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  scale = Math.max(.6,Math.min(2,scale * (e.deltaY < 0 ? 1.08 : .92)));
  update();
},{passive:false});
</script>
</body>
</html>
